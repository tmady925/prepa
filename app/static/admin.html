<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prepa — Dashboard Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f1a; color: #e2e8f0; min-height: 100vh; }
        .header { background: #1a1a2e; padding: 20px 32px; border-bottom: 1px solid #2d2d4e; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 22px; font-weight: 700; color: #818cf8; }
        .header .auth { display: flex; gap: 12px; align-items: center; }
        .header input[type=password] { background: #2d2d4e; border: 1px solid #3d3d6e; color: #e2e8f0; padding: 8px 14px; border-radius: 8px; font-size: 14px; width: 240px; }
        .header button { background: #6366f1; color: white; border: none; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
        .header button:hover { background: #4f46e5; }
        .container { max-width: 1200px; margin: 0 auto; padding: 32px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
        .stat-card { background: #1a1a2e; border: 1px solid #2d2d4e; border-radius: 12px; padding: 20px; text-align: center; }
        .stat-card .value { font-size: 32px; font-weight: 800; color: #818cf8; }
        .stat-card .label { font-size: 12px; color: #94a3b8; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
        .section { background: #1a1a2e; border: 1px solid #2d2d4e; border-radius: 12px; padding: 24px; margin-bottom: 24px; }
        .section h2 { font-size: 16px; font-weight: 600; margin-bottom: 20px; color: #c7d2fe; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 10px 14px; color: #94a3b8; font-weight: 500; border-bottom: 1px solid #2d2d4e; font-size: 11px; text-transform: uppercase; }
        td { padding: 10px 14px; border-bottom: 1px solid #1e1e38; }
        tr:hover td { background: #1e1e38; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge.pro { background: #fef3c7; color: #92400e; }
        .badge.free { background: #e0e7ff; color: #3730a3; }
        .badge.active { background: #d1fae5; color: #065f46; }
        .badge.indexed { background: #d1fae5; color: #065f46; }
        .badge.onboarding { background: #fce7f3; color: #9d174d; }
        .badge.processing { background: #fef3c7; color: #92400e; }
        .badge.error { background: #fee2e2; color: #991b1b; }
        .btn-sm { background: #6366f1; color: white; border: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        .btn-sm:hover { background: #4f46e5; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .btn-green { background: #10b981; }
        .btn-green:hover { background: #059669; }
        .config-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
        .config-item { background: #0f0f1a; border: 1px solid #2d2d4e; border-radius: 8px; padding: 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .config-key { font-size: 12px; color: #94a3b8; font-family: monospace; }
        .config-value { display: flex; gap: 8px; align-items: center; }
        .config-value input { background: #1a1a2e; border: 1px solid #3d3d6e; color: #e2e8f0; padding: 5px 10px; border-radius: 6px; font-size: 13px; width: 100px; text-align: right; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
        .dot.custom { background: #818cf8; }
        .dot.default { background: #4b5563; }
        .loading { color: #94a3b8; text-align: center; padding: 40px; }
        .toast { position: fixed; bottom: 24px; right: 24px; background: #10b981; color: white; padding: 12px 20px; border-radius: 10px; font-size: 14px; display: none; z-index: 1000; }
        select { background: #0f0f1a; border: 1px solid #3d3d6e; color: #e2e8f0; padding: 6px; border-radius: 6px; font-size: 12px; }
        textarea { background: #0f0f1a; border: 1px solid #3d3d6e; color: #e2e8f0; padding: 10px; border-radius: 8px; font-size: 13px; width: 100%; resize: vertical; font-family: inherit; }
        .notif-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .notif-preview { background: #0f0f1a; border: 1px solid #2d2d4e; border-radius: 8px; padding: 16px; min-height: 120px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
        .target-badge { background: #6366f1; color: white; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; display: inline-block; margin-left: 8px; }
        .variables-hint { background: #1e1e38; border-radius: 6px; padding: 10px 14px; font-size: 11px; color: #94a3b8; margin-bottom: 12px; }
        .variables-hint code { background: #2d2d4e; padding: 1px 5px; border-radius: 3px; color: #818cf8; }
        @media (max-width: 768px) { .notif-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="header">
    <h1>⚡ Prepa Admin</h1>
    <div class="auth">
        <input type="password" id="adminKey" placeholder="Clé admin..." />
        <button onclick="loadDashboard()">Connexion</button>
    </div>
</div>

<div class="container">
    <div id="content" class="loading">Entrez la clé admin pour accéder au dashboard</div>
</div>

<div class="toast" id="toast"></div>

<script>
let API_KEY = '';

function showToast(msg, error = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = error ? '#ef4444' : '#10b981';
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
}

async function api(path, method = 'GET', body = null) {
    const opts = {
        method,
        headers: { 'X-Admin-Key': API_KEY, 'Content-Type': 'application/json' }
    };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch('/api/v1' + path, opts);
    if (!res.ok) throw new Error('Erreur API ' + res.status);
    return res.json();
}

async function loadDashboard() {
    API_KEY = document.getElementById('adminKey').value;
    if (!API_KEY) return;

    document.getElementById('content').innerHTML = '<div class="loading">Chargement...</div>';

    try {
        const [stats, users, configs, docs] = await Promise.all([
            api('/admin/stats'),
            api('/admin/users?limit=20'),
            api('/admin/config'),
            api('/admin/documents'),
        ]);

        document.getElementById('content').innerHTML = `
            <div class="stats-grid">
                <div class="stat-card"><div class="value">${stats.total_users}</div><div class="label">Élèves total</div></div>
                <div class="stat-card"><div class="value">${stats.active_users}</div><div class="label">Actifs</div></div>
                <div class="stat-card"><div class="value">${stats.pro_users}</div><div class="label">Pro ⭐</div></div>
                <div class="stat-card"><div class="value">${stats.conversion_rate}%</div><div class="label">Conversion</div></div>
                <div class="stat-card"><div class="value">${stats.total_messages.toLocaleString()}</div><div class="label">Messages</div></div>
                <div class="stat-card"><div class="value">${(stats.total_revenue_fcfa || 0).toLocaleString()} F</div><div class="label">Revenus</div></div>
            </div>

            <div class="section">
                <h2>💸 Consommation API LLM</h2>
                <div class="stats-grid" style="margin-bottom:20px">
                    <div class="stat-card"><div class="value">${(stats.tokens_today || 0).toLocaleString()}</div><div class="label">Tokens aujourd'hui</div></div>
                    <div class="stat-card"><div class="value">$${stats.cost_today_usd || '0.0000'}</div><div class="label">Coût aujourd'hui (USD)</div></div>
                    <div class="stat-card"><div class="value">${(stats.tokens_total || 0).toLocaleString()}</div><div class="label">Tokens total</div></div>
                    <div class="stat-card"><div class="value">$${stats.cost_total_usd || '0.0000'}</div><div class="label">Coût total (USD)</div></div>
                </div>
                ${Object.keys(stats.provider_breakdown || {}).length > 0 ? `
                <table>
                    <thead><tr><th>Provider</th><th>Tokens aujourd'hui</th><th>Coût estimé</th></tr></thead>
                    <tbody>
                        ${Object.entries(stats.provider_breakdown).map(([p, d]) => `
                            <tr>
                                <td><span class="badge" style="background:#e0e7ff;color:#3730a3">${p}</span></td>
                                <td>${(d.tokens || 0).toLocaleString()}</td>
                                <td>$${d.cost_usd}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>` : '<p style="color:#4b5563;font-size:13px">Aucun appel LLM aujourd\'hui.</p>'}
            </div>

            <div class="section">
                <h2>📣 Notifications WhatsApp</h2>
                <div class="variables-hint">
                    Variables disponibles :
                    <code>{nom}</code> <code>{streak}</code> <code>{jours_restants}</code>
                    <code>{plan}</code> <code>{exam}</code> <code>{serie}</code> <code>{messages}</code>
                </div>
                <div class="notif-grid">
                    <div>
                        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px">
                            <div>
                                <div style="font-size:11px;color:#94a3b8;margin-bottom:4px">Audience</div>
                                <select id="notifFilter" onchange="updateCount()">
                                    <option value="all">Tous les élèves</option>
                                    <option value="inactive_24h">Inactifs 24h</option>
                                    <option value="inactive_7d">Inactifs 7 jours</option>
                                    <option value="before_exam_7d">Examen dans 7 jours</option>
                                    <option value="before_exam_30d">Examen dans 30 jours</option>
                                    <option value="free_users">Plan Gratuit</option>
                                    <option value="pro_users">Plan Pro</option>
                                </select>
                            </div>
                            <div>
                                <div style="font-size:11px;color:#94a3b8;margin-bottom:4px">Examen</div>
                                <select id="notifExam" onchange="updateCount()">
                                    <option value="">Tous</option>
                                    <option value="bac_senegal">BAC Sénégal</option>
                                    <option value="bfem">BFEM</option>
                                    <option value="concours">Concours</option>
                                </select>
                            </div>
                            <div>
                                <div style="font-size:11px;color:#94a3b8;margin-bottom:4px">Série</div>
                                <select id="notifSeries" onchange="updateCount()">
                                    <option value="">Toutes</option>
                                    <option value="S1">S1</option>
                                    <option value="S2">S2</option>
                                    <option value="L1">L1</option>
                                    <option value="L2">L2</option>
                                </select>
                            </div>
                            <div style="display:flex;align-items:flex-end">
                                <div>
                                    <div style="font-size:11px;color:#94a3b8;margin-bottom:4px">Destinataires</div>
                                    <div id="targetCount" class="target-badge">—</div>
                                </div>
                            </div>
                        </div>

                        <div style="margin-bottom:8px">
                            <div style="font-size:11px;color:#94a3b8;margin-bottom:4px">Message <span style="color:#4b5563">(utilise les variables ci-dessus)</span></div>
                            <textarea id="notifMessage" rows="8" placeholder="Écris ton message ici...

Exemple :
👋 Salut {nom} !

Il te reste {jours_restants} jours avant ton examen.
Révise avec moi aujourd'hui ! 📚" oninput="updatePreview()"></textarea>
                        </div>

                        <div style="display:flex;gap:8px;margin-top:12px">
                            <button class="btn-sm" onclick="updatePreview()" style="padding:8px 14px">👁 Aperçu</button>
                            <button class="btn-sm btn-green" onclick="sendNotification()" style="padding:8px 14px">📤 Envoyer</button>
                        </div>
                        <div id="notifStatus" style="margin-top:10px;font-size:12px;color:#94a3b8"></div>
                    </div>

                    <div>
                        <div style="font-size:11px;color:#94a3b8;margin-bottom:8px">Aperçu du message</div>
                        <div class="notif-preview" id="notifPreview">
                            <span style="color:#4b5563">L'aperçu apparaîtra ici...</span>
                        </div>
                        <div style="margin-top:16px">
                            <div style="font-size:11px;color:#94a3b8;margin-bottom:8px">Messages prédéfinis</div>
                            <div style="display:flex;flex-direction:column;gap:6px">
                                <button class="btn-sm" onclick="useTemplate('motivation')" style="text-align:left;padding:6px 10px">🔥 Motivation streak</button>
                                <button class="btn-sm" onclick="useTemplate('rappel')" style="text-align:left;padding:6px 10px">📚 Rappel révision</button>
                                <button class="btn-sm" onclick="useTemplate('urgence')" style="text-align:left;padding:6px 10px">⚠️ Urgence examen</button>
                                <button class="btn-sm" onclick="useTemplate('upsell')" style="text-align:left;padding:6px 10px">⭐ Passage Pro</button>
                                <button class="btn-sm" onclick="useTemplate('weekend')" style="text-align:left;padding:6px 10px">🌟 Message weekend</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>⚙️ Configuration plateforme</h2>
                <div class="config-grid">
                    ${configs.map(c => `
                        <div class="config-item">
                            <div>
                                <span class="dot ${c.is_custom ? 'custom' : 'default'}"></span>
                                <span class="config-key">${c.key}</span>
                            </div>
                            <div class="config-value">
                                <input type="text" value="${c.value}" id="cfg_${c.key.replace(/[^a-z0-9]/gi, '_')}" />
                                <button class="btn-sm" onclick="saveConfig('${c.key}')">✓</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>

            <div class="section">
                <h2>📝 Upload Exercices</h2>
                <p style="font-size:11px;color:#94a3b8;margin-bottom:12px">
                    Uploade un document contenant des exercices — le système détecte automatiquement
                    chaque exercice, génère les PDFs et crée les corrections.
                </p>
                <div style="margin-bottom:16px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
                    <div>
                        <div style="font-size:11px;color:#94a3b8;margin-bottom:4px">Fichier PDF</div>
                        <input type="file" id="exFile" accept=".pdf"
                            style="background:#0f0f1a;border:1px solid #3d3d6e;color:#e2e8f0;padding:6px;border-radius:6px;font-size:12px"/>
                    </div>
                    <div>
                        <div style="font-size:11px;color:#94a3b8;margin-bottom:4px">Examen</div>
                        <select id="exExam">
                            <option value="">-- Examen --</option>
                            <option value="bac_senegal">BAC Sénégal</option>
                            <option value="bfem">BFEM</option>
                            <option value="concours">Concours</option>
                        </select>
                    </div>
                    <div>
                        <div style="font-size:11px;color:#94a3b8;margin-bottom:4px">Série</div>
                        <select id="exSerie">
                            <option value="">-- Série --</option>
                            <option value="S1">S1</option>
                            <option value="S2">S2</option>
                            <option value="S3">S3</option>
                            <option value="L1">L1</option>
                            <option value="L2">L2</option>
                            <option value="T">T</option>
                        </select>
                    </div>
                    <div>
                        <div style="font-size:11px;color:#94a3b8;margin-bottom:4px">Matière</div>
                        <select id="exMatiere">
                            <option value="">-- Matière --</option>
                            <option value="maths">Maths</option>
                            <option value="physique_chimie">Physique-Chimie</option>
                            <option value="svt">SVT</option>
                            <option value="francais">Français</option>
                            <option value="philosophie">Philosophie</option>
                            <option value="histoire_geo">Histoire-Géo</option>
                            <option value="anglais">Anglais</option>
                        </select>
                    </div>
                    <button class="btn-sm btn-green" onclick="uploadExercises()" style="padding:8px 16px">🔍 Analyser et Extraire</button>
                </div>
                <div id="exStatus" style="font-size:12px;color:#94a3b8;margin-bottom:12px"></div>
                <div id="exResults"></div>
            </div>

            <div class="section">
                <h2>📚 Documents RAG</h2>
                <p style="font-size:11px;color:#94a3b8;margin-bottom:12px">Max 10MB par fichier. Pour les fichiers plus grands : <code style="background:#0f0f1a;padding:2px 6px;border-radius:4px">python scripts/index_documents.py</code></p>
                <div style="margin-bottom:16px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
                    <div>
                        <div style="font-size:11px;color:#94a3b8;margin-bottom:4px">Fichier (PDF/Word)</div>
                        <input type="file" id="docFile" accept=".pdf,.docx,.doc" style="background:#0f0f1a;border:1px solid #3d3d6e;color:#e2e8f0;padding:6px;border-radius:6px;font-size:12px"/>
                    </div>
                    <div>
                        <div style="font-size:11px;color:#94a3b8;margin-bottom:4px">Titre</div>
                        <input type="text" id="docTitle" placeholder="Titre" style="background:#0f0f1a;border:1px solid #3d3d6e;color:#e2e8f0;padding:6px 10px;border-radius:6px;font-size:12px;width:140px"/>
                    </div>
                    <div>
                        <div style="font-size:11px;color:#94a3b8;margin-bottom:4px">Examen</div>
                        <select id="docExam">
                            <option value="">-- Examen --</option>
                            <option value="bac_senegal">BAC Sénégal</option>
                            <option value="bfem">BFEM</option>
                            <option value="concours">Concours</option>
                        </select>
                    </div>
                    <div>
                        <div style="font-size:11px;color:#94a3b8;margin-bottom:4px">Série</div>
                        <select id="docSeries">
                            <option value="">-- Série --</option>
                            <option value="S1">S1</option>
                            <option value="S2">S2</option>
                            <option value="S3">S3</option>
                            <option value="L1">L1</option>
                            <option value="L2">L2</option>
                            <option value="T">T</option>
                        </select>
                    </div>
                    <div>
                        <div style="font-size:11px;color:#94a3b8;margin-bottom:4px">Matière</div>
                        <select id="docSubject">
                            <option value="">-- Matière --</option>
                            <option value="maths">Maths</option>
                            <option value="physique_chimie">Physique-Chimie</option>
                            <option value="svt">SVT</option>
                            <option value="francais">Français</option>
                            <option value="philosophie">Philosophie</option>
                            <option value="histoire_geo">Histoire-Géo</option>
                            <option value="anglais">Anglais</option>
                        </select>
                    </div>
                    <div>
                        <div style="font-size:11px;color:#94a3b8;margin-bottom:4px">Type</div>
                        <select id="docType">
                            <option value="cours">Cours</option>
                            <option value="annale">Annale</option>
                            <option value="correction">Correction</option>
                            <option value="serie">Série</option>
                            <option value="devoir">Devoir</option>
                            <option value="fiche">Fiche</option>
                            <option value="exercice">Exercice</option>
                        </select>
                    </div>
                    <button class="btn-sm" onclick="uploadDocument()" style="padding:8px 16px">⬆️ Indexer</button>
                </div>
                <div id="uploadStatus" style="font-size:12px;color:#94a3b8;margin-bottom:12px"></div>
                <table>
                    <thead>
                        <tr>
                            <th>Titre</th>
                            <th>Examen</th>
                            <th>Série</th>
                            <th>Matière</th>
                            <th>Type</th>
                            <th>Pages</th>
                            <th>Chunks</th>
                            <th>Statut</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${docs.map(d => `
                            <tr>
                                <td>${d.title}</td>
                                <td>${d.exam_type || '—'}</td>
                                <td>${d.serie || '—'}</td>
                                <td>${d.matiere || '—'}</td>
                                <td>${d.doc_type || '—'}</td>
                                <td>${d.page_count}</td>
                                <td>${d.chunk_count}</td>
                                <td><span class="badge ${d.status}">${d.status}</span></td>
                                <td><button class="btn-sm btn-danger" onclick="deleteDocument('${d.id}')">🗑</button></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>

            <div class="section">
                <h2>👥 Élèves récents</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Nom</th>
                            <th>Téléphone</th>
                            <th>Plan</th>
                            <th>Statut</th>
                            <th>Examen</th>
                            <th>Streak</th>
                            <th>Messages</th>
                            <th>Score</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${users.map(u => `
                            <tr>
                                <td>${u.name || '—'}</td>
                                <td>${u.phone}</td>
                                <td><span class="badge ${u.plan}">${u.plan}</span></td>
                                <td><span class="badge ${u.status}">${u.status}</span></td>
                                <td>${u.exam_type || '—'} ${u.series || ''}</td>
                                <td>🔥 ${u.streak_days}j</td>
                                <td>${u.total_messages}</td>
                                <td>${u.engagement_score}/100</td>
                                <td style="display:flex;gap:6px">
                                    <button class="btn-sm" onclick="resetQuota('${u.id}')">Reset quota</button>
                                    ${u.plan !== 'pro' ? `<button class="btn-sm" onclick="activatePro('${u.id}')">→ Pro</button>` : ''}
                                    <button class="btn-sm btn-danger" onclick="deleteUser('${u.id}', '${u.name || u.phone}')">🗑</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;

        // Charge le nombre de destinataires initial
        updateCount();

    } catch (e) {
        document.getElementById('content').innerHTML = '<div class="loading">Clé invalide ou erreur serveur</div>';
    }
}

// ── Notifications ──────────────────────────────────────────────────

const TEMPLATES = {
    motivation: "🔥 Salut {nom} !\n\nTon streak de *{streak} jours* est impressionnant !\n\nContinue comme ça — il te reste *{jours_restants} jours* avant ton examen.\n\nPose-moi une question pour continuer ta révision ! 💪",
    rappel: "📚 Salut {nom} !\n\nN'oublie pas de réviser aujourd'hui.\n\nIl te reste *{jours_restants} jours* avant ton {exam}.\n\nTape */profil* pour voir ta progression 📊",
    urgence: "⚠️ *{nom}* — Plus que *{jours_restants} jours* avant ton examen !\n\nC'est le moment de tout donner. Je suis là pour t'aider à réviser chaque chapitre.\n\nDis-moi sur quoi tu veux travailler aujourd'hui 🎯",
    upsell: "⭐ *{nom}*, passe *Prepa Pro* et révise sans limite !\n\n✅ Messages illimités\n✅ Réponses plus détaillées\n✅ Priorité de traitement\n\n💰 Seulement *500 FCFA/mois*\n\nTape */plan* pour en savoir plus 🚀",
    weekend: "🌟 Bon weekend *{nom}* !\n\nProfite du weekend pour réviser sans pression.\n*{jours_restants} jours* avant ton examen — un peu de révision aujourd'hui fait toute la différence !\n\nJe suis disponible 24h/24 📚",
};

function useTemplate(type) {
    document.getElementById('notifMessage').value = TEMPLATES[type] || '';
    updatePreview();
}

function updatePreview() {
    const msg = document.getElementById('notifMessage').value;
    const preview = msg
        .replace(/\{nom\}/g, 'Fatou')
        .replace(/\{streak\}/g, '5')
        .replace(/\{jours_restants\}/g, '42')
        .replace(/\{plan\}/g, 'FREE')
        .replace(/\{exam\}/g, 'BAC')
        .replace(/\{serie\}/g, 'S2')
        .replace(/\{messages\}/g, '28');

    document.getElementById('notifPreview').textContent = preview || 'Aperçu du message...';
}

async function updateCount() {
    if (!API_KEY) return;
    try {
        const data = await api('/admin/notifications/count', 'POST', {
            filter_type: document.getElementById('notifFilter')?.value || 'all',
            exam_type: document.getElementById('notifExam')?.value || null,
            series: document.getElementById('notifSeries')?.value || null,
        });
        const el = document.getElementById('targetCount');
        if (el) el.textContent = data.count + ' élèves';
    } catch(e) {
        const el = document.getElementById('targetCount');
        if (el) el.textContent = '—';
    }
}

async function sendNotification() {
    const msg = document.getElementById('notifMessage').value.trim();
    if (!msg) { showToast('Écris un message', true); return; }

    const count = document.getElementById('targetCount').textContent;
    if (!confirm('Envoyer ce message à ' + count + ' ?')) return;

    const status = document.getElementById('notifStatus');
    status.textContent = '⏳ Envoi en cours...';

    try {
        const result = await api('/admin/notifications/send', 'POST', {
            filter_type: document.getElementById('notifFilter').value,
            message_type: 'custom',
            custom_message: msg,
            exam_type: document.getElementById('notifExam').value || null,
            series: document.getElementById('notifSeries').value || null,
        });
        status.textContent = '✅ Envoyé à ' + result.sent + ' élèves' + (result.failed > 0 ? ' (' + result.failed + ' échecs)' : '');
        showToast('Notifications envoyées : ' + result.sent);
    } catch(e) {
        status.textContent = '❌ Erreur envoi';
        showToast('Erreur', true);
    }
}

// ── Config ─────────────────────────────────────────────────────────

async function saveConfig(key) {
    const safeKey = key.replace(/[^a-z0-9]/gi, '_');
    const val = document.getElementById('cfg_' + safeKey).value;
    let parsed = val;
    if (!isNaN(val) && val !== '') parsed = Number(val);
    if (val === 'true') parsed = true;
    if (val === 'false') parsed = false;
    try {
        await api('/admin/config', 'POST', { key, value: parsed });
        showToast(key + ' mis à jour');
    } catch (e) {
        showToast('Erreur', true);
    }
}

async function resetQuota(userId) {
    try {
        await api('/admin/users/' + userId + '/reset-quota', 'POST');
        showToast('Quota réinitialisé');
    } catch (e) {
        showToast('Erreur', true);
    }
}

async function activatePro(userId) {
    try {
        await api('/admin/users/' + userId + '/activate-pro', 'POST');
        showToast('Plan Pro activé');
        loadDashboard();
    } catch (e) {
        showToast('Erreur', true);
    }
}

async function deleteUser(userId, userName) {
    if (!confirm(`Supprimer définitivement l'élève "${userName}" et toutes ses données ?`)) return;
    try {
        await api('/admin/users/' + userId, 'DELETE');
        showToast('Élève supprimé');
        loadDashboard();
    } catch (e) {
        showToast('Erreur suppression', true);
    }
}

// ── Documents ──────────────────────────────────────────────────────

async function uploadDocument() {
    const file = document.getElementById('docFile').files[0];
    if (!file) { showToast('Sélectionne un fichier', true); return; }

    if (file.size > 10 * 1024 * 1024) {
        showToast('Fichier trop grand (max 10MB)', true);
        document.getElementById('uploadStatus').textContent = '❌ Max 10MB. Utilise : python scripts/index_documents.py';
        return;
    }

    const status = document.getElementById('uploadStatus');
    status.textContent = '⏳ Lecture (' + (file.size / 1024 / 1024).toFixed(1) + ' MB)...';

    const reader = new FileReader();
    reader.onload = async (e) => {
        const b64 = e.target.result.split(',')[1];
        status.textContent = '⏳ Indexation en cours...';

        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 300000);

            const res = await fetch('/api/v1/admin/documents/upload', {
                method: 'POST',
                headers: { 'X-Admin-Key': API_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    filename: file.name,
                    file_b64: b64,
                    title: document.getElementById('docTitle').value || file.name,
                    exam_type: document.getElementById('docExam').value,
                    series: document.getElementById('docSeries').value,
                    subject: document.getElementById('docSubject').value,
                    doc_type: document.getElementById('docType').value,
                }),
                signal: controller.signal,
            });

            clearTimeout(timeoutId);

            if (res.status === 413) {
                status.textContent = '❌ Fichier trop grand.';
                showToast('Fichier trop grand', true);
                return;
            }
            if (!res.ok) throw new Error('Erreur ' + res.status);

            const result = await res.json();
            if (result.success) {
                status.textContent = '✅ ' + result.chunks + ' chunks, ' + result.pages + ' pages';
                showToast('Document indexé');
                loadDashboard();
            } else {
                status.textContent = '❌ ' + result.error;
                showToast('Erreur indexation', true);
            }
        } catch(e) {
            status.textContent = e.name === 'AbortError' ? '❌ Timeout' : '❌ ' + e.message;
            showToast('Erreur', true);
        }
    };
    reader.readAsDataURL(file);
}

async function uploadExercises() {
    const file = document.getElementById('exFile').files[0];
    if (!file) { showToast('Sélectionne un fichier PDF', true); return; }

    const status = document.getElementById('exStatus');
    const results = document.getElementById('exResults');
    status.textContent = '⏳ Analyse en cours... (peut prendre 1-2 minutes)';
    results.innerHTML = '';

    const reader = new FileReader();
    reader.onload = async (e) => {
        const b64 = e.target.result.split(',')[1];

        try {
            const res = await fetch('/api/v1/admin/documents/upload-exercises', {
                method: 'POST',
                headers: { 'X-Admin-Key': API_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    filename: file.name,
                    file_b64: b64,
                    exam_type: document.getElementById('exExam').value || null,
                    serie: document.getElementById('exSerie').value || null,
                    matiere: document.getElementById('exMatiere').value || null,
                }),
            });

            const data = await res.json();

            if (data.success) {
                status.textContent = `✅ ${data.exercises_count} exercices extraits — ${data.matiere} ${data.exam_type} ${data.annee || ''}`;
                results.innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>N°</th>
                                <th>Titre</th>
                                <th>Exercice PDF</th>
                                <th>Correction PDF</th>
                                <th>Statut</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.exercises.map(ex => `
                                <tr>
                                    <td>${ex.number}</td>
                                    <td>${ex.title}</td>
                                    <td>${ex.exercise_path ? '✅' : '❌'}</td>
                                    <td>${ex.correction_path ? (ex.correction_generated ? '✅ générée' : '✅ extraite') : '❌'}</td>
                                    <td>${ex.error ? '❌ ' + ex.error : '✅'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
                showToast(`${data.exercises_count} exercices extraits`);
            } else {
                status.textContent = '❌ ' + (data.error || 'Erreur inconnue');
                showToast('Erreur analyse', true);
            }
        } catch(e) {
            status.textContent = '❌ ' + e.message;
            showToast('Erreur', true);
        }
    };
    reader.readAsDataURL(file);
}

async function deleteDocument(docId) {
    if (!confirm('Supprimer ce document et tous ses chunks ?')) return;
    try {
        await api('/admin/documents/' + docId, 'DELETE');
        showToast('Document supprimé');
        loadDashboard();
    } catch(e) {
        showToast('Erreur', true);
    }
}
