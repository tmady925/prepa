server {
    listen 80;
    server_name _;  # Remplace par ton domaine si tu en as un

    # Taille max upload (PDFs exercices = jusqu'à 15 MB)
    client_max_body_size 20M;
    client_body_timeout 310s;
    send_timeout 310s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Headers standards
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts — doit être > timeout-keep-alive uvicorn (300s)
        proxy_connect_timeout 10s;
        proxy_read_timeout    310s;
        proxy_send_timeout    310s;

        # Désactive le buffering pour les longues réponses
        proxy_buffering off;
    }

    # Fichiers statiques servis directement par nginx (plus rapide)
    location /static/ {
        alias /home/prepa/app/app/static/;
        expires 1d;
        add_header Cache-Control "public";
    }

    # PDFs exercices et corrections
    location /exercises/ {
        alias /home/prepa/app/exercises/;
    }

    location /corrections/ {
        alias /home/prepa/app/corrections/;
    }
}
