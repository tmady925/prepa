services:
  - type: web
    name: prepa
    runtime: python
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WASENDER_API_KEY
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: WHATSAPP_WEBHOOK_SECRET
        sync: false
      - key: WASENDER_BASE_URL
        value: https://api.wasender.com/api
      - key: MISTRAL_API_KEY
        sync: false
      - key: PAYDUNYA_MASTER_KEY
        sync: false
      - key: PAYDUNYA_PRIVATE_KEY
        sync: false
      - key: PAYDUNYA_PUBLIC_KEY
        sync: false
      - key: PAYDUNYA_TOKEN
        sync: false
      - key: PAYDUNYA_MODE
        value: test
      - key: APP_BASE_URL
        sync: false